[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "genelytics"
version = "0.1.0"
description = "Chat-driven analytics and ETL engine over any SQLAlchemy database"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Genelytics Contributors" }]
keywords = ["analytics", "nl2sql", "etl", "langchain", "sqlalchemy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain==1.3.13",
    "langchain-core==1.4.9",
    "langchain-community==0.4.2",
    "langchain-openai==1.3.5",
    "langchain-ollama==1.1.0",
    "sqlalchemy==2.0.29",
    "pymysql==1.1.0",
    "psycopg2-binary==2.9.9",
    "pandas==2.2.2",
    "pyyaml==6.0.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
]

[project.optional-dependencies]
demo = ["flask==3.0.3"]
bedrock = ["langchain-aws>=0.2.0", "boto3>=1.34.0"]
dev = [
    "pytest==8.3.5",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
]
all = ["genelytics[demo,dev,bedrock]"]

[project.urls]
Homepage = "https://github.com/adnanrahin/generative-data-analytics-engine"
Repository = "https://github.com/adnanrahin/generative-data-analytics-engine"

[project.scripts]
genelytics-demo = "genelytics.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["genelytics*"]

[tool.setuptools.package-data]
genelytics = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
